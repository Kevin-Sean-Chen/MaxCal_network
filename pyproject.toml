[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maxcal-network"
version = "0.1.0"
description = "Maximum-caliber tools for network inference."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
scripts = [
    "brian2",
    "matplotlib",
    "networkx",
    "numpy<2",
    "pyglmnet==1.1",
    "scikit-learn",
    "statsmodels",
]
dev = [
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
